<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Daniela & Guilherme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cinzel', serif;
      background-color: #0d0b0b;
    }

    /* Ambient Dark Background */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 45%, #2a2220 0%, #0a0808 100%);
      z-index: 10;
      perspective: 1200px;
      overflow: hidden;
    }

    /* Envelope Base Container */
    .envelope-wrapper {
      position: relative;
      width: 90%;
      max-width: 460px;
      height: 580px;
      background-color: #FAF8F5;
      /* Subtle Damask Pattern */
      background-image: 
        radial-gradient(#e2dad0 1px, transparent 1px),
        radial-gradient(#e2dad0 1px, #FAF8F5 1px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      border-radius: 6px;
      box-shadow: 
        0 35px 80px rgba(0, 0, 0, 0.8),
        inset 0 0 80px rgba(210, 195, 180, 0.35);
      border: 1px solid #E3DCD3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 50px;
      transform-style: preserve-3d;
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }

    /* Envelope Top Triangular Flap */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 280px;
      background-color: #F8F5F0;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border-bottom: 1px solid #E0D7CD;
      transform-origin: top center;
      transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 3;
    }

    /* Rose Gold Foil Baroque Crest */
    .baroque-crest {
      position: relative;
      width: 220px;
      height: 220px;
      margin-top: 10px;
      z-index: 2;
    }

    /* Metallic Foil Shimmer Effect */
    .foil-text {
      background: linear-gradient(135deg, #fce5d8 0%, #b87355 30%, #e0a38b 50%, #8a482d 75%, #d99b82 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.3));
    }

    /* D&G Calligraphy Monogram inside Crest */
    .monogram-calligraphy {
      font-family: 'Alex Brush', cursive;
      font-size: 3.8rem;
      text-align: center;
      line-height: 200px;
      user-select: none;
    }

    /* White Tag / Guest Name Card */
    .guest-tag {
      position: absolute;
      bottom: 130px;
      width: 200px;
      height: 55px;
      background: #FFFFFF;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12), inset 0 0 0 1px #EFEAE4;
      border-radius: 2px;
      z-index: 4;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 3D Rose Gold / Copper Wax Seal */
    .seal-button {
      position: absolute;
      bottom: 155px;
      width: 95px;
      height: 95px;
      border: none;
      background: none;
      cursor: pointer;
      z-index: 5;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .seal-button:hover {
      transform: scale(1.08) rotate(2deg);
    }

    .seal-body {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      /* Metallic Rose Gold / Copper Liquid Wax Shader */
      background: radial-gradient(circle at 35% 30%, #e8a892 0%, #ba6a50 40%, #7c3b26 75%, #421b0f 100%);
      box-shadow: 
        0 12px 28px rgba(0, 0, 0, 0.5),
        inset 0 3px 6px rgba(255, 255, 255, 0.5),
        inset 0 -6px 12px rgba(0, 0, 0, 0.6);
      clip-path: polygon(
        50% 0%, 65% 2%, 78% 8%, 91% 20%, 98% 35%, 100% 50%, 
        96% 68%, 88% 83%, 75% 94%, 58% 99%, 40% 98%, 
        23% 93%, 10% 81%, 2% 64%, 0% 46%, 4% 28%, 15% 13%, 31% 3%
      );
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Embossed Infinity Symbol on Wax Seal */
    .infinity-symbol {
      font-size: 2.5rem;
      font-weight: bold;
      color: #592314;
      text-shadow: 
        1px 1px 1px rgba(255, 230, 215, 0.6),
        -1px -1px 2px rgba(0, 0, 0, 0.8);
      user-select: none;
    }

    .instruction-text {
      position: absolute;
      bottom: 45px;
      font-size: 0.72rem;
      letter-spacing: 3px;
      color: #948273;
      text-transform: uppercase;
      z-index: 4;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Opening Animations */
    .seal-button.break {
      animation: breakSeal 0.6s forwards cubic-bezier(0.6, -0.28, 0.735, 0.045);
    }

    @keyframes breakSeal {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3) rotate(-8deg); opacity: 0.8; }
      100% { transform: scale(1.8) rotate(15deg); opacity: 0; filter: blur(3px); }
    }

    .envelope-wrapper.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope-wrapper.fade-out {
      opacity: 0;
      transform: translateY(30px) scale(0.96);
      pointer-events: none;
    }

    /* Canvas Particle Overlay */
    #particleCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
  </style>
</head>
<body>

  <!-- Background Music -->
  <audio id="invitation-music" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-wedding-113253.mp3" type="audio/mpeg">
  </audio>

  <!-- Particle Canvas for Gold Dust -->
  <canvas id="particleCanvas"></canvas>

  <div id="stage">
    <div class="envelope-wrapper" id="envelope">
      <!-- Triangular Flap -->
      <div class="envelope-flap"></div>

      <!-- Rose Gold Baroque Crest -->
      <div class="baroque-crest">
        <svg width="220" height="220" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fce5d8"/>
              <stop offset="35%" stop-color="#b87355"/>
              <stop offset="65%" stop-color="#e0a38b"/>
              <stop offset="100%" stop-color="#7c3b26"/>
            </linearGradient>
          </defs>
          
          <!-- Crown & Ornate Flourish Frame -->
          <g stroke="url(#roseGold)" fill="none" stroke-width="2.5" stroke-linecap="round">
            <!-- Outer Oval Rim -->
            <ellipse cx="150" cy="150" rx="95" ry="105" stroke-dasharray="4,3"/>
            <ellipse cx="150" cy="150" rx="88" ry="98"/>
            <ellipse cx="150" cy="150" rx="84" ry="94"/>
            
            <!-- Crown Top -->
            <path d="M130,42 L135,28 L150,36 L165,28 L170,42 Z" fill="url(#roseGold)"/>
            <circle cx="135" cy="25" r="2.5" fill="url(#roseGold)"/>
            <circle cx="150" cy="31" r="3" fill="url(#roseGold)"/>
            <circle cx="165" cy="25" r="2.5" fill="url(#roseGold)"/>
            
            <!-- Bottom Flourishes -->
            <path d="M120,250 C135,265 165,265 180,250 C165,258 135,258 120,250 Z" fill="url(#roseGold)"/>
            <path d="M90,150 C70,120 70,180 90,150 Z"/>
            <path d="M210,150 C230,120 230,180 210,150 Z"/>
          </g>
        </svg>

        <!-- Calligraphy D&G Monogram -->
        <div class="monogram-calligraphy foil-text" style="position: absolute; inset: 0;">D&amp;G</div>
      </div>

      <!-- Guest Tag -->
      <div class="guest-tag"></div>

      <!-- 3D Rose Gold Wax Seal -->
      <button class="seal-button" id="sealBtn" aria-label="Abrir Invitación">
        <div class="seal-body">
          <div class="infinity-symbol">∞</div>
        </div>
      </button>

      <div class="instruction-text">Toca el sello para abrir</div>
    </div>
  </div>

  <script>
    const sealBtn = document.getElementById('sealBtn');
    const envelope = document.getElementById('envelope');
    const music = document.getElementById('invitation-music');
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const CANVA_URL = "https://tiger-f5rc4h.my.canva.site/invitaciondyg";

    // Resize Particle Canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Particle Burst Effect
    let particles = [];
    function createBurst(x, y) {
      for (let i = 0; i < 45; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8 - 2,
          radius: Math.random() * 3 + 1,
          color: `hsl(${Math.random() * 20 + 15}, 70%, ${Math.random() * 30 + 60}%)`,
          alpha: 1,
          decay: Math.random() * 0.02 + 0.015
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        
        ctx.save();
        ctx.globalAlpha = Math.max(p.alpha, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (p.alpha <= 0) particles.splice(index, 1);
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Click Trigger
    sealBtn.addEventListener('click', (e) => {
      const rect = sealBtn.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2;
      const clickY = rect.top + rect.height / 2;

      // 1. Play Music
      music.play().catch(err => console.log('Audio autoplay:', err));

      // 2. Gold Dust Burst
      createBurst(clickX, clickY);

      // 3. Break Seal
      sealBtn.classList.add('break');

      // 4. Open Flap
      setTimeout(() => {
        envelope.classList.add('open');
      }, 300);

      // 5. Fade envelope and transition to Canva link
      setTimeout(() => {
        envelope.classList.add('fade-out');
      }, 900);

      setTimeout(() => {
        window.location.href = CANVA_URL;
      }, 1500);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Daniel & Gabriela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cinzel', serif;
      background-color: #0d0a09;
    }

    /* Envelope & Paper Background */
    #wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2c1b18 0%, #0d0a09 100%);
      z-index: 10;
    }

    .paper-card {
      position: relative;
      width: 90%;
      max-width: 440px;
      padding: 40px 20px;
      background: #fcf9f2;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 0 60px rgba(184, 152, 103, 0.2);
      border: 1px solid #e0d5c1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .title {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: #5c1d24;
      text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
    }

    .subtitle {
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: #7a6b5d;
      text-transform: uppercase;
    }

    /* 1800s Wax Seal Button */
    .seal-button {
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      padding: 10px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      -webkit-tap-highlight-color: transparent;
    }

    .seal-button:hover {
      transform: scale(1.08) rotate(2deg);
    }

    .seal-button:active {
      transform: scale(0.95);
    }

    .instructions {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #8c7a6b;
      text-transform: uppercase;
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Break Animation */
    .seal-button.breaking {
      animation: sealBreak 0.8s forwards ease-in-out;
    }

    @keyframes sealBreak {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3) rotate(-8deg); opacity: 0.9; }
      100% { transform: scale(1.8) rotate(12deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="invitation-audio" preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-wedding-113253.mp3" type="audio/mpeg">
  </audio>

  <!-- Interactive Seal Overlay -->
  <div id="wrapper">
    <div class="paper-card">
      <div class="title">Daniel & Gabriela</div>
      <div class="subtitle">Nuestra Invitación</div>

      <!-- Wax Seal SVG -->
      <button class="seal-button" id="sealBtn" aria-label="Abrir invitación">
        <svg width="150" height="150" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="waxGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#b82626"/>
              <stop offset="50%" stop-color="#800e0e"/>
              <stop offset="100%" stop-color="#4a0404"/>
            </radialGradient>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f9e79f"/>
              <stop offset="50%" stop-color="#d4ac0d"/>
              <stop offset="100%" stop-color="#7d6608"/>
            </linearGradient>
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
            </filter>
          </defs>
          
          <!-- Outer Irregular Wax Shape -->
          <path d="M100,12 C125,10 148,20 165,37 C182,54 190,78 188,102 C186,126 175,149 157,165 C139,181 114,190 90,187 C66,184 43,171 28,153 C13,135 7,111 11,87 C15,63 29,41 48,26 C67,11 88,12 100,12 Z" 
                fill="url(#waxGrad)" filter="url(#shadow)"/>
          
          <!-- Inner Rim -->
          <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="4"/>
          <circle cx="100" cy="100" r="66" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4"/>
          
          <!-- Monogram D&G -->
          <text x="100" y="112" 
                font-family="'Georgia', serif" 
                font-size="44" 
                font-weight="bold" 
                font-style="italic" 
                fill="url(#goldGrad)" 
                text-anchor="middle"
                style="filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.8));">D&amp;G</text>
        </svg>
      </button>

      <div class="instructions">Haz clic en el sello para abrir</div>
    </div>
  </div>

  <script>
    const sealBtn = document.getElementById('sealBtn');
    const audio = document.getElementById('invitation-audio');
    const CANVA_URL = "https://tiger-f5rc4h.my.canva.site/invitaciondyg";

    sealBtn.addEventListener('click', () => {
      // 1. Play song sound
      audio.play().catch(e => console.log('Audio playback status:', e));

      // 2. Animate seal opening
      sealBtn.classList.add('breaking');

      // 3. Navigate directly to Canva site after animation
      setTimeout(() => {
        window.location.href = CANVA_URL;
      }, 700);
    });
  </script>
</body>
</html>

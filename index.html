<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#f5f1e8" />

  <title>Daniela & Guilherme — Wedding Invitation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #f5f1e8;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* =========================================================
       BACKGROUND
       ========================================================= */

    .invitation {
      position: relative;
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255,255,255,0.95) 0%,
          rgba(249,246,239,0.92) 35%,
          rgba(242,237,227,1) 100%
        );
    }

    /* Subtle paper texture */
    .invitation::before {
      content: "";
      position: absolute;
      inset: 0;

      opacity: 0.22;
      pointer-events: none;

      background-image:
        radial-gradient(
          rgba(80,70,60,0.12) 0.45px,
          transparent 0.55px
        );

      background-size: 5px 5px;
    }

    /* Soft central light */
    .light {
      position: absolute;

      width: 80vw;
      height: 80vw;

      max-width: 850px;
      max-height: 850px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,0.8) 0%,
          rgba(255,255,255,0) 70%
        );

      pointer-events: none;
    }

    /* =========================================================
       SEAL
       ========================================================= */

    .seal-container {
      position: relative;

      width: min(72vw, 620px);
      aspect-ratio: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 5;

      animation:
        sealEntrance
        1.4s
        cubic-bezier(0.18, 0.9, 0.25, 1)
        forwards;
    }

    /* Realistic shadow underneath */
    .seal-shadow {
      position: absolute;

      width: 68%;
      height: 11%;

      bottom: 5%;

      border-radius: 50%;

      background: rgba(25, 31, 38, 0.25);

      filter: blur(25px);

      transform: translateY(15px);

      opacity: 0;

      animation:
        shadowAppear
        1.4s
        0.35s
        ease
        forwards;
    }

    .seal {
      position: relative;

      width: 100%;
      height: 100%;

      filter:
        drop-shadow(
          0 17px 18px rgba(24,32,42,0.18)
        );

      transform-origin: center;

      transition:
        transform 0.7s cubic-bezier(0.2,0.8,0.2,1);
    }

    /* Gentle movement while waiting */
    .seal-container:hover .seal {
      transform: scale(1.015) rotate(-0.4deg);
    }

    /* =========================================================
       CLICK MESSAGE
       ========================================================= */

    .click-message {
      position: absolute;

      bottom: 10%;

      z-index: 10;

      color: #51555a;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 11px;

      letter-spacing: 0.38em;

      text-align: center;

      white-space: nowrap;

      opacity: 0;

      animation:
        messageAppear
        1.2s
        1.6s
        ease
        forwards;
    }

    /* =========================================================
       OPEN ANIMATION
       ========================================================= */

    .opening .seal-container {
      animation:
        sealOpen
        1.05s
        cubic-bezier(0.2,0.8,0.2,1)
        forwards;
    }

    .opening .click-message {
      animation:
        messageDisappear
        0.35s
        ease
        forwards;
    }

    .opening .light {
      animation:
        lightExpand
        1s
        ease
        forwards;
    }

    .opening {
      animation:
        backgroundFade
        1.1s
        ease
        forwards;
    }

    /* =========================================================
       ANIMATIONS
       ========================================================= */

    @keyframes sealEntrance {

      0% {
        opacity: 0;

        transform:
          scale(0.72)
          rotate(-4deg);
      }

      55% {
        opacity: 1;

        transform:
          scale(1.025)
          rotate(0.5deg);
      }

      75% {
        transform:
          scale(0.985)
          rotate(-0.2deg);
      }

      100% {
        opacity: 1;

        transform:
          scale(1)
          rotate(0);
      }
    }

    @keyframes shadowAppear {

      from {
        opacity: 0;
        transform: translateY(25px) scale(0.8);
      }

      to {
        opacity: 1;
        transform: translateY(15px) scale(1);
      }
    }

    @keyframes messageAppear {

      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 0.78;
        transform: translateY(0);
      }
    }

    @keyframes sealOpen {

      0% {
        opacity: 1;

        transform:
          scale(1)
          rotate(0);
      }

      35% {
        transform:
          scale(1.045)
          rotate(-1deg);
      }

      100% {
        opacity: 0;

        transform:
          scale(1.28)
          rotate(3deg);
      }
    }

    @keyframes messageDisappear {

      to {
        opacity: 0;
      }
    }

    @keyframes lightExpand {

      0% {
        transform: scale(1);
        opacity: 1;
      }

      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    @keyframes backgroundFade {

      0% {
        background: #f5f1e8;
      }

      100% {
        background: #ffffff;
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      .seal-container {
        width: 78vw;
        max-width: 500px;
      }

      .click-message {
        bottom: 9%;

        font-size: 10px;

        letter-spacing: 0.28em;
      }
    }
  </style>
</head>


<body>

  <main
    class="invitation"
    id="invitation"
    aria-label="Open wedding invitation"
  >

    <div class="light"></div>


    <!-- =====================================================
         D&G WAX SEAL
         ===================================================== -->

    <div class="seal-container">

      <div class="seal-shadow"></div>


      <svg
        class="seal"
        viewBox="0 0 600 600"
        xmlns="http://www.w3.org/2000/svg"
        aria-label="D and G wax seal"
        role="img"
      >

        <defs>

          <!-- Main wax colour -->
          <radialGradient
            id="wax"
            cx="38%"
            cy="30%"
            r="75%"
          >

            <stop
              offset="0%"
              stop-color="#566d82"
            />

            <stop
              offset="48%"
              stop-color="#3f566b"
            />

            <stop
              offset="100%"
              stop-color="#273b4d"
            />

          </radialGradient>


          <!-- Inner highlight -->
          <radialGradient
            id="highlight"
            cx="35%"
            cy="25%"
            r="75%"
          >

            <stop
              offset="0%"
              stop-color="rgba(255,255,255,0.35)"
            />

            <stop
              offset="100%"
              stop-color="rgba(255,255,255,0)"
            />

          </radialGradient>


          <!-- Embossed shadow -->
          <filter
            id="embossShadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%"
          >

            <feDropShadow
              dx="2"
              dy="3"
              stdDeviation="2"
              flood-color="#172735"
              flood-opacity="0.75"
            />

          </filter>

        </defs>


        <!-- Irregular outer wax edge -->

        <path
          d="
          M300 25
          C335 22 350 38 378 30
          C405 22 420 43 446 45
          C474 47 479 71 500 82
          C525 95 518 121 538 140
          C558 160 546 185 563 207
          C580 230 562 250 575 276
          C588 302 567 320 570 345
          C573 373 548 383 545 410
          C542 438 515 440 500 463
          C485 486 459 477 437 497
          C415 517 390 503 365 522
          C340 541 319 518 292 532
          C265 545 248 519 222 524
          C194 530 184 503 158 497
          C132 491 132 464 110 450
          C87 435 98 407 78 388
          C58 369 75 343 65 319
          C54 294 77 276 69 250
          C61 223 84 207 80 181
          C76 153 103 143 111 119
          C120 94 146 96 164 75
          C182 54 207 64 230 49
          C253 34 275 47 300 25
          Z
          "

          fill="url(#wax)"

          stroke="#25394a"
          stroke-width="9"

          filter="url(#embossShadow)"
        />


        <!-- Wax highlight -->

        <circle
          cx="285"
          cy="270"
          r="225"
          fill="url(#highlight)"
          opacity="0.25"
        />


        <!-- Outer engraved rings -->

        <circle
          cx="300"
          cy="300"
          r="220"
          fill="none"
          stroke="#7890a3"
          stroke-width="5"
          opacity="0.55"
        />

        <circle
          cx="300"
          cy="300"
          r="202"
          fill="none"
          stroke="#203547"
          stroke-width="4"
          opacity="0.9"
        />

        <circle
          cx="300"
          cy="300"
          r="188"
          fill="none"
          stroke="#71899b"
          stroke-width="3"
          opacity="0.5"
        />


        <!-- Decorative dots -->

        <g
          fill="#9aaebe"
          opacity="0.65"
        >

          <circle cx="300" cy="92" r="5"/>
          <circle cx="404" cy="120" r="5"/>
          <circle cx="478" cy="195" r="5"/>
          <circle cx="506" cy="300" r="5"/>
          <circle cx="478" cy="405" r="5"/>
          <circle cx="404" cy="480" r="5"/>
          <circle cx="300" cy="508" r="5"/>
          <circle cx="196" cy="480" r="5"/>
          <circle cx="122" cy="405" r="5"/>
          <circle cx="94" cy="300" r="5"/>
          <circle cx="122" cy="195" r="5"/>
          <circle cx="196" cy="120" r="5"/>

        </g>


        <!-- =================================================
             D & G MONOGRAM
             ================================================= -->

        <g
          text-anchor="middle"
          dominant-baseline="middle"
          fill="#d2dce3"
          stroke="#203547"
          stroke-width="3"
          paint-order="stroke"
          filter="url(#embossShadow)"
        >

          <text
            x="300"
            y="295"
            font-family="Georgia, Times New Roman, serif"
            font-size="155"
            font-weight="bold"
            letter-spacing="-25"
          >
            D
          </text>

          <text
            x="365"
            y="320"
            font-family="Georgia, Times New Roman, serif"
            font-size="155"
            font-weight="bold"
            letter-spacing="-25"
          >
            G
          </text>

        </g>


        <!-- Small ornamental divider -->

        <path
          d="
          M225 408
          C250 392 275 392 300 408
          C325 392 350 392 375 408
          "
          fill="none"
          stroke="#9caebb"
          stroke-width="4"
          opacity="0.7"
        />


        <!-- Tiny central heart -->

        <path
          d="
          M300 425
          C288 407 263 414 263 432
          C263 451 300 468 300 468
          C300 468 337 451 337 432
          C337 414 312 407 300 425
          Z
          "
          fill="#9caebb"
          opacity="0.7"
        />

      </svg>

    </div>


    <div class="click-message">
      CLICK TO OPEN
    </div>

  </main>


  <script>

    const invitation =
      document.getElementById("invitation");

    let opened = false;


    function openInvitation() {

      if (opened) return;

      opened = true;

      /*
       * Start the visual opening animation.
       */

      invitation.classList.add("opening");


      /*
       * Give the animation time to play,
       * then take the guest to the real
       * Canva wedding invitation.
       */

      setTimeout(function () {

        window.location.href =
          "https://tiger-f5rc4h.my.canva.site/invitaciondyg";

      }, 850);

    }


    /*
     * Phone / tablet
     */

    invitation.addEventListener(
      "click",
      openInvitation
    );


    /*
     * Keyboard accessibility
     */

    invitation.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {

          event.preventDefault();

          openInvitation();

        }

      }
    );

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Daniel & Gabriela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cinzel', serif;
      background-color: #080606;
    }

    /* Fullscreen dark vignette background */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: 
        radial-gradient(circle at 50% 50%, rgba(40, 24, 20, 0.85) 0%, rgba(8, 6, 6, 0.98) 100%),
        url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1000&auto=format&fit=crop') center/cover;
      background-blend-mode: overlay;
      z-index: 10;
    }

    /* Vintage Linen Invitation Card */
    .envelope-card {
      position: relative;
      width: 90%;
      max-width: 420px;
      padding: 50px 24px 40px 24px;
      background: #FAF7F2;
      border-radius: 4px;
      box-shadow: 
        0 30px 90px rgba(0, 0, 0, 0.85),
        inset 0 0 80px rgba(180, 140, 90, 0.15),
        inset 0 0 0 1px rgba(255, 255, 255, 0.8);
      border: 1px solid #D8CEBE;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .names {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #362826;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .sub-title {
      font-size: 0.75rem;
      letter-spacing: 4px;
      color: #8C7867;
      text-transform: uppercase;
      margin-top: -15px;
    }

    /* 3D Wax Seal Button */
    .seal-container {
      position: relative;
      width: 160px;
      height: 160px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .wax-seal {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      /* 19th Century Deep Royal Burgundy Wax Shader */
      background: 
        radial-gradient(circle at 32% 28%, #d13434 0%, #800f12 45%, #4a0507 80%, #2b0203 100%);
      box-shadow: 
        0 18px 40px rgba(0, 0, 0, 0.65),
        0 6px 10px rgba(0, 0, 0, 0.4),
        inset 0 4px 8px rgba(255, 255, 255, 0.45),
        inset 0 -8px 16px rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
      /* Organic wax pool shape */
      clip-path: polygon(
        50% 0%, 63% 2%, 76% 7%, 88% 16%, 96% 29%, 100% 45%, 
        97% 62%, 91% 77%, 80% 89%, 66% 97%, 49% 100%, 
        33% 97%, 18% 90%, 8% 77%, 1% 61%, 0% 44%, 
        5% 28%, 14% 15%, 28% 5%, 39% 1%
      );
    }

    .seal-container:hover .wax-seal {
      transform: scale(1.06) rotate(1deg);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.75);
    }

    /* Inner Stamped Rim & Foil Monogram */
    .seal-emboss {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      border: 2px dashed rgba(212, 175, 55, 0.55);
      box-shadow: 
        inset 0 3px 6px rgba(0,0,0,0.6),
        0 1px 2px rgba(255,255,255,0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.08) 0%, transparent 70%);
    }

    .monogram {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.7rem;
      font-weight: 600;
      font-style: italic;
      /* Embossed Gold Foil Texture */
      background: linear-gradient(135deg, #FFE89C 0%, #D4AF37 40%, #AA771C 70%, #634208 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.85));
      letter-spacing: -1px;
    }

    .click-prompt {
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: #9E8976;
      text-transform: uppercase;
      animation: pulseText 2s infinite ease-in-out;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Seal Opening Particle Transition */
    .seal-container.shatter {
      animation: waxCrack 0.8s forwards cubic-bezier(0.6, -0.28, 0.735, 0.045);
    }

    @keyframes waxCrack {
      0% { transform: scale(1); opacity: 1; }
      40% { transform: scale(1.25) rotate(-6deg); opacity: 0.9; }
      100% { transform: scale(2.2) rotate(15deg); opacity: 0; filter: blur(4px); }
    }

    .stage-fade {
      transition: opacity 1s ease-out, transform 1s ease-out;
      opacity: 0 !important;
      transform: scale(1.08) !important;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Background Music Stream -->
  <audio id="bg-audio" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-wedding-113253.mp3" type="audio/mpeg">
  </audio>

  <!-- Opening Envelope Card -->
  <div id="stage">
    <div class="envelope-card">
      <div class="names">Daniel & Gabriela</div>
      <div class="sub-title">Nuestra Invitación</div>

      <div class="seal-container" id="sealBtn">
        <div class="wax-seal">
          <div class="seal-emboss">
            <div class="monogram">D&G</div>
          </div>
        </div>
      </div>

      <div class="click-prompt">Toca el sello para abrir</div>
    </div>
  </div>

  <script>
    const sealBtn = document.getElementById('sealBtn');
    const stage = document.getElementById('stage');
    const audio = document.getElementById('bg-audio');
    const TARGET_URL = "https://tiger-f5rc4h.my.canva.site/invitaciondyg";

    sealBtn.addEventListener('click', () => {
      // Start audio playback
      audio.play().catch(err => console.log("Audio playback:", err));

      // Trigger 3D crack animation
      sealBtn.classList.add('shatter');

      // Fade out background card smoothly
      setTimeout(() => {
        stage.classList.add('stage-fade');
      }, 400);

      // Transition to Canva link
      setTimeout(() => {
        window.location.href = TARGET_URL;
      }, 1100);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación D&G</title>
  <style>
    :root {
      --wax-red: #8B0000;
      --wax-dark: #580000;
      --gold-light: #F7E08B;
      --gold-mid: #D4AF37;
      --gold-dark: #AA771C;
      --paper-color: #FDFBF7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Cinzel', 'Georgia', serif;
      background-color: #121212;
    }

    /* Container for iframe */
    #canva-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Envelope / Cover Overlay */
    #envelope-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2c2523 0%, #0f0c0b 100%);
      transition: opacity 1.2s ease-in-out, visibility 1.2s;
    }

    .paper-texture {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: var(--paper-color);
      background-image: 
        radial-gradient(#e3ded1 1px, transparent 0),
        radial-gradient(#e3ded1 1px, var(--paper-color) 0);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      opacity: 0.95;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.2);
    }

    .invitation-text {
      position: absolute;
      top: 25%;
      text-align: center;
      color: #4a3e3d;
      letter-spacing: 3px;
      font-size: 1.1rem;
      text-transform: uppercase;
      opacity: 0.85;
      animation: pulseText 2s infinite alternate ease-in-out;
    }

    @keyframes pulseText {
      from { opacity: 0.6; transform: scale(0.98); }
      to { opacity: 0.95; transform: scale(1); }
    }

    /* 1800s Wax Seal Styling */
    .seal-wrapper {
      position: relative;
      z-index: 20;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .wax-seal {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #b22222, var(--wax-red) 65%, var(--wax-dark) 100%);
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.5),
        inset 0 3px 6px rgba(255, 255, 255, 0.3),
        inset 0 -6px 12px rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      /* Organic wax edge shape */
      clip-path: polygon(
        50% 0%, 65% 3%, 79% 8%, 91% 19%, 97% 33%, 
        100% 50%, 96% 68%, 89% 82%, 76% 93%, 60% 98%, 
        43% 97%, 27% 93%, 12% 81%, 3% 65%, 0% 48%, 
        4% 31%, 13% 16%, 28% 6%
      );
    }

    .seal-wrapper:hover .wax-seal {
      transform: scale(1.04);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6);
    }

    /* Inner Ring and Monogram */
    .seal-inner {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px dashed rgba(212, 175, 55, 0.6);
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .monogram {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 2.2rem;
      font-weight: bold;
      font-style: italic;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-mid) 50%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
      letter-spacing: 1px;
    }

    .seal-laurel {
      position: absolute;
      width: 90px;
      height: 90px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      pointer-events: none;
    }

    .sub-text {
      font-size: 0.6rem;
      color: var(--gold-light);
      letter-spacing: 2px;
      margin-top: -4px;
      opacity: 0.8;
      text-transform: uppercase;
    }

    /* Split Animation for Seal Opening */
    .seal-wrapper.open .wax-seal {
      animation: breakSeal 0.8s forwards ease-in-out;
    }

    @keyframes breakSeal {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2) rotate(5deg); opacity: 0.9; }
      100% { transform: scale(1.5) rotate(-10deg); opacity: 0; }
    }

    /* Overlay Slide Away */
    #envelope-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Audio element (Replace src with your invitation song link if needed) -->
  <audio id="invitation-music" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-wedding-113253.mp3" type="audio/mpeg">
  </audio>

  <!-- Canva Website Embed -->
  <div id="canva-container">
    <iframe id="canva-frame" src="https://tiger-f5rc4h.my.canva.site/invitaciondyg" allow="autoplay"></iframe>
  </div>

  <!-- Opening Envelope Screen -->
  <div id="envelope-overlay">
    <div class="paper-texture"></div>
    <div class="invitation-text">Has sido invitado<br><span style="font-size: 0.8rem; font-style: italic;">Haz clic en el sello para abrir</span></div>
    
    <div class="seal-wrapper" id="sealBtn">
      <div class="wax-seal">
        <div class="seal-laurel"></div>
        <div class="seal-inner">
          <div class="monogram">D&G</div>
          <div class="sub-text">Abrir</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sealBtn = document.getElementById('sealBtn');
    const overlay = document.getElementById('envelope-overlay');
    const music = document.getElementById('invitation-music');

    sealBtn.addEventListener('click', () => {
      // 1. Play Background Music
      music.play().catch(error => {
        console.log("Audio autoplay prevented by browser policy: ", error);
      });

      // 2. Trigger Seal Breaking Animation
      sealBtn.classList.add('open');

      // 3. Fade out overlay and reveal Canva site
      setTimeout(() => {
        overlay.classList.add('fade-out');
      }, 600);
    });
  </script>
</body>
</html>
